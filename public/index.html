<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Tracking System - Asset Tracking Monitor System (OCFA)</title>
    <!-- Modern Fonts (Local Same-Origin CSS) -->
    <link rel="stylesheet" href="/fonts.css">
    <link rel="stylesheet" href="/login.css?v=6.0">
    <style>
        /* Exact layout and proportions matching the official Future Soldier reference */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: transparent;
            color: #1f2937;
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 12px;
        }

        body {
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('/bg.png') no-repeat center center fixed;
            background-size: cover;
        }

        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('/bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -2;
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            z-index: -1;
        }

        .login-wrapper {
            width: 100%;
            max-width: 430px;
            margin: auto;
            z-index: 10;
        }

        .login-card {
            background: rgba(243, 246, 250, 0.94);
            border-radius: 20px;
            padding: 28px 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.22),
                        inset 0 1px 0 rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            text-align: left;
        }

        .login-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .tcl-logo {
            height: 62px;
            width: auto;
            max-width: 130px;
            margin: 0 auto 8px auto;
            display: block;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.08));
        }

        .system-title {
            color: #2e7d32;
            font-family: 'Outfit', sans-serif;
            font-size: 1.55rem;
            font-weight: 700;
            margin: 0 0 4px 0;
            letter-spacing: -0.02em;
        }

        .system-subtitle {
            color: #4b5563;
            font-size: 0.85rem;
            font-weight: 500;
            margin: 0 0 14px 0;
            line-height: 1.35;
        }

        .login-heading {
            color: #111827;
            font-family: 'Outfit', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            margin: 0;
        }

        .login-alert {
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            line-height: 1.35;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
            font-weight: 500;
        }

        .login-alert.alert-error {
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
        }

        .login-alert.alert-warning {
            background-color: #fffbeb;
            border: 1px solid #fde68a;
            color: #b45309;
        }

        .login-alert.alert-success {
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #15803d;
        }

        .form-group {
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 0.88rem;
            font-weight: 600;
            color: #374151;
        }

        .required-star {
            color: #ef4444;
            margin-left: 2px;
            font-weight: bold;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
        }

        .input-wrapper input {
            width: 100%;
            height: 40px;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #d1d5db;
            background-color: #ffffff;
            font-size: 0.95rem;
            font-family: inherit;
            color: #111827;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: #2e7d32;
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.15);
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6b7280;
            z-index: 2;
        }

        .password-toggle:hover {
            color: #111827;
        }

        /* Captcha Box */
        .captcha-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            padding: 4px 10px;
            height: 46px;
            margin-bottom: 8px;
        }

        .captcha-preview {
            flex: 1;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #ffffff;
        }

        .captcha-preview svg {
            max-width: 100%;
            height: 100%;
            display: block;
        }

        .captcha-refresh-btn {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            border: none;
            background: transparent;
            color: #374151;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, color 0.2s;
            flex-shrink: 0;
        }

        .captcha-refresh-btn:hover {
            color: #111827;
            transform: rotate(45deg);
        }

        .captcha-refresh-btn.rotating svg {
            animation: spin 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .captcha-loading {
            color: #9ca3af;
            font-size: 0.8rem;
        }

        .btn-submit {
            width: 100%;
            height: 42px;
            border-radius: 6px;
            border: none;
            background-color: #cbd5e1;
            color: #475569;
            font-family: inherit;
            font-size: 0.98rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background-color: #2e7d32;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.25);
        }

        .btn-submit:active {
            transform: translateY(1px);
        }

        .btn-spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        .login-footer {
            margin-top: 16px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .register-text {
            font-size: 0.88rem;
            color: #4b5563;
        }

        .register-text a, .forgot-link a {
            color: #2e7d32;
            text-decoration: none;
            font-weight: 600;
            transition: text-decoration 0.2s;
        }

        .register-text a:hover, .forgot-link a:hover {
            text-decoration: underline;
        }

        .forgot-link {
            font-size: 0.88rem;
        }
    </style>
</head>
<body>

    <!-- Background Image -->
    <div class="bg-image"></div>
    <div class="bg-overlay"></div>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <img src="/tcl-logo.png" alt="TCL Logo" class="tcl-logo" />
                <h1 class="system-title">GPS Tracking System</h1>
                <p class="system-subtitle">Asset Tracking Monitor System (OCFA)</p>
                <h2 class="login-heading">Login</h2>
            </div>

            <!-- Dynamic Feedback & Security Alert Banner -->
            <div id="login-alert" class="login-alert" style="display: none;" role="alert">
                <svg id="alert-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span id="alert-message"></span>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">User Login ID<span class="required-star">*</span></label>
                    <div class="input-wrapper">
                        <input type="text" id="username" placeholder="" required autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password <span class="required-star">*</span></label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="" required autocomplete="current-password" style="padding-right: 40px;">
                        <button type="button" class="password-toggle" id="password-toggle-btn" aria-label="Toggle password visibility">
                            <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"></path>
                                <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Professional Security Verification CAPTCHA -->
                <div class="form-group captcha-group">
                    <label for="captcha-input">Captcha <span class="required-star">*</span></label>
                    <div class="captcha-box">
                        <div class="captcha-preview" id="captcha-preview" title="CAPTCHA challenge">
                            <span class="captcha-loading">Loading...</span>
                        </div>
                        <button type="button" class="captcha-refresh-btn" id="captcha-refresh-btn" aria-label="Refresh challenge" title="Refresh">
                            <svg id="refresh-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
                            </svg>
                        </button>
                    </div>
                    <div class="input-wrapper">
                        <input type="text" id="captcha-input" placeholder="Enter the code above" required autocomplete="off" maxlength="8" spellcheck="false" autocapitalize="characters">
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="btn-submit">
                    <span id="btn-submit-text">Login</span>
                    <div id="btn-submit-spinner" class="btn-spinner" style="display: none;"></div>
                </button>
            </form>

            <div class="login-footer">
                <p class="register-text">New personnel? <a href="/register.html">Register</a></p>
                <p class="forgot-link"><a href="#" id="forgot-password-link">Forgot Password?</a></p>
            </div>
        </div>
    </div>

    <script src="/login.js?v=6.0"></script>
</body>
</html>
