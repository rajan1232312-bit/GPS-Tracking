<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Vehicle Tracker - Premium Login</title>
    <!-- Modern Fonts (Local Same-Origin CSS) -->
    <link rel="stylesheet" href="/fonts.css">
    <link rel="stylesheet" href="/login.css">
</head>
<body>

    <!-- Background Image -->
    <div class="bg-image"></div>
    <div class="bg-overlay"></div>

    <div class="login-wrapper">
        <div class="logo-container">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 22s-8-4.5-8-11.8A8 8 0 0 1 12 2a8 8 0 0 1 8 8.2c0 7.3-8 11.8-8 11.8z"></path>
                    <path d="M12 6.5l-3 6.5 3-1.5 3 1.5-3-6.5z"></path>
                </svg>
            </div>
            <div class="logo-text">GPS Vehicle Tracker</div>
        </div>

        <div class="login-card">
            <div class="login-header">
                <img src="https://troopcomfortslimited.co.in/wp-content/uploads/2025/03/tclLogo.png" alt="TCL Logo" class="tcl-logo" />
                <h1>Welcome Back</h1>
                <p>Log in to access your dashboard</p>
                <div class="encryption-badge">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <span>RSA-2048 & AES-256 Encrypted Login</span>
                </div>
            </div>

            <!-- Dynamic Feedback & Security Alert Banner -->
            <div id="login-alert" class="login-alert" style="display: none;" role="alert">
                <svg id="alert-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span id="alert-message"></span>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">User Login</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" placeholder="e.g. admin" required autocomplete="username">
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 12px;">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" style="padding-right: 48px;">
                        <button type="button" class="password-toggle" id="password-toggle-btn" aria-label="Toggle password visibility">
                            <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"></path>
                                <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            </svg>
                        </button>
                    </div>
                    <div class="password-meta">
                        <a href="#" class="forgot-password">Forgot password?</a>
                    </div>
                </div>

                <!-- Professional Security Verification CAPTCHA -->
                <div class="form-group captcha-group">
                    <div class="captcha-label-row">
                        <label for="captcha-input">Security Verification</label>
                        <span class="captcha-subtext">Case-insensitive</span>
                    </div>
                    <div class="captcha-box">
                        <div class="captcha-preview" id="captcha-preview" title="CAPTCHA challenge">
                            <span class="captcha-loading">Loading challenge...</span>
                        </div>
                        <button type="button" class="captcha-refresh-btn" id="captcha-refresh-btn" aria-label="Refresh verification challenge" title="Get a new verification challenge">
                            <svg id="refresh-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
                            </svg>
                        </button>
                    </div>
                    <div class="input-wrapper">
                        <input type="text" id="captcha-input" placeholder="Type characters shown above" required autocomplete="off" maxlength="8" spellcheck="false" autocapitalize="characters">
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="btn-submit">
                    <span id="btn-submit-text">Sign In</span>
                    <svg id="btn-submit-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                    <div id="btn-submit-spinner" class="btn-spinner" style="display: none;"></div>
                </button>
            </form>

            <div class="divider">or</div>

            <button type="button" class="sso-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Continue with Google
            </button>
        </div>
        
        <div class="footer-text">
            Don't have an account? <a href="/register.html">Register now</a>
        </div>
    </div>

    <script src="/login.js"></script>
</body>
</html>
