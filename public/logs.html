<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Logs - Real-Time GPS Tracker</title>
    <!-- Fonts (Local Same-Origin CSS) -->
    <link rel="stylesheet" href="/fonts.css">
    <!-- FontAwesome with Subresource Integrity (SRI) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/logs.css">
</head>
<body>

    <div class="container">
        <!-- Top Header Navigation -->
        <header class="header">
            <div>
                <h1 id="page-title"><i class="fa-solid fa-list-ul"></i> System Telemetry Logs</h1>
                <div class="header-subtitle"><span class="pulse-dot"></span> Live Telemetry & Vitals Audit Stream</div>
            </div>
            <div class="header-nav">
                <a href="/dashboard.html" class="nav-btn nav-btn-primary">
                    <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
                </a>
                <a href="/vitals.html" class="nav-btn">
                    <i class="fa-solid fa-heart-pulse"></i> Vitals Dashboard
                </a>
            </div>
        </header>

        <!-- Dedicated Filter & Controls Toolbar -->
        <div class="filter-toolbar">
            <div class="filter-group">
                <!-- Log Type Filter -->
                <div class="filter-container">
                    <i class="fa-solid fa-layer-group filter-icon"></i>
                    <select id="log-type-filter" class="aesthetic-select">
                        <option value="telemetry">🛰️ GPS Telemetry Logs</option>
                        <option value="vitals">🩺 Health Vitals Logs</option>
                    </select>
                </div>

                <!-- Device Filter -->
                <div class="filter-container">
                    <i class="fa-solid fa-microchip filter-icon"></i>
                    <select id="device-filter" class="aesthetic-select">
                        <option value="all">All Devices (Total)</option>
                    </select>
                </div>

                <!-- Transport Filter -->
                <div class="filter-container">
                    <i class="fa-solid fa-tower-broadcast filter-icon"></i>
                    <select id="transport-filter" class="aesthetic-select">
                        <option value="all">All Networks</option>
                        <option value="0">🟣 LoRa (0)</option>
                        <option value="1">🔵 GSM (1)</option>
                        <option value="2">🟢 Wi-Fi (2)</option>
                    </select>
                </div>
            </div>

            <div class="toolbar-actions">
                <button class="nav-btn" id="refresh-logs-btn" title="Refresh Logs" style="padding: 10px 18px;">
                    <i class="fa-solid fa-rotate"></i> Refresh
                </button>
            </div>
        </div>

        <div class="logs-card">
            <div class="table-responsive">
                <table>
                    <thead id="logs-thead">
                        <!-- Dynamic Header Rendered by renderTableHeader() -->
                    </thead>
                    <tbody id="logs-body">
                        <tr>
                            <td colspan="8" class="empty-state">
                                <i class="fa-solid fa-circle-notch fa-spin"></i>
                                <p>Loading logs...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <!-- Premium Pagination Controls -->
            <div class="pagination-container" id="pagination-container" style="display: none;">
                <div class="pagination-info" id="pagination-info">Total Logs: <strong>0</strong></div>
                <div class="pagination-buttons">
                    <button class="nav-btn" id="prev-page-btn" disabled><i class="fa-solid fa-chevron-left"></i> Previous</button>
                    <span id="page-indicator" style="color: #f8fafc; font-weight: 600; font-size: 0.95rem; padding: 0 10px;">Page 1</span>
                    <button class="nav-btn" id="next-page-btn"><i class="fa-solid fa-chevron-right"></i> Next</button>
                </div>
            </div>

        </div>
    </div>

    <!-- Socket.io for Real-time Updates -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="/logs.js"></script>
</body>
</html>
